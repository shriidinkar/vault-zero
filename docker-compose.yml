version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: vaultzero-postgres
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: vault_zero
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: vaultzero-redis
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  ollama:
    image: ollama/ollama:latest
    container_name: vaultzero-ollama
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    environment:
      - OLLAMA_KEEP_ALIVE=24h

  forensics-service:
    build:
      context: .
      dockerfile: packages/forensics/Dockerfile
    container_name: vaultzero-forensics
    ports:
      - "8000:8000"
    environment:
      - PORT=8000
    depends_on:
      - postgres

  agent-service:
    build:
      context: .
      dockerfile: packages/agents/Dockerfile
    container_name: vaultzero-agents
    ports:
      - "8001:8001"
    environment:
      - OLLAMA_BASE_URL=http://ollama:11434
      - LLM_MODEL=qwen2.5:3b-instruct
    depends_on:
      - ollama

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: vaultzero-app
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - DATABASE_URL=postgresql://postgres:postgres@postgres:5432/vault_zero
      - REDIS_URL=redis://redis:6379
      - FORENSICS_SERVICE_URL=http://forensics-service:8000
      - AGENTS_SERVICE_URL=http://agent-service:8001
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  postgres_data:
  redis_data:
  ollama_data:
